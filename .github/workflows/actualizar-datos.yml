name: Actualizar datos

# Cada hora, en el minuto 17 UTC. El cron de GitHub es muy poco fiable (se salta pasadas durante horas), así que
# cada ejecución deja programada la siguiente (job «siguiente»: espera al próximo :17 y se relanza con workflow_dispatch,
# que sí funciona con GITHUB_TOKEN). El cron queda solo como red de seguridad para reenganchar la cadena si se rompe;
# la concurrencia deja como mucho una ejecución en espera, así que nunca hay cadenas duplicadas.
# El colector decide qué publicaciones medir: las de menos de 72 h cada hora, las de hasta 2 semanas cada 6 h y las
# más antiguas una vez al día. Se puede lanzar a mano desde la pestaña Actions.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Recoger, aprender y preparar la web
        # pipeline/colector.mjs es un solo archivo (lo genera «sincronizar» desde el proyecto privado): no hay npm install.
        env:
          UPLOADPOST_API_KEY: ${{ secrets.UPLOADPOST_API_KEY }}
          UPLOADPOST_USER: ${{ secrets.UPLOADPOST_USER }}
          UPLOADPOST_FACEBOOK_PAGE_ID: ${{ secrets.UPLOADPOST_FACEBOOK_PAGE_ID }}
          CONTRATITULAR_DATOS: datos
        run: node pipeline/colector.mjs colector .

      - name: Publicar si hay cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.js datos/
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "Datos $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push

  siguiente:
    # Se ejecuta aunque la recogida falle, para que la cadena no se corte.
    needs: recolectar
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Esperar al próximo minuto 17 y relanzar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ahora=$(date -u +%s)
          objetivo=$(( (ahora / 3600) * 3600 + 17 * 60 ))
          while [ "$objetivo" -le $(( ahora + 300 )) ]; do objetivo=$(( objetivo + 3600 )); done
          echo "Siguiente pasada: $(date -u -d @$objetivo +%H:%MZ)"
          sleep $(( objetivo - ahora ))
          gh workflow run actualizar-datos.yml -R "$GITHUB_REPOSITORY" --ref main
